version: '3.8'

services:
  # PHP Application (Laravel)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: technician-portal-app
    container_name: technician-portal-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - technician-network
    depends_on:
      - db

  # Scheduler for Laravel Tasks
  scheduler:
    image: technician-portal-app
    container_name: technician-portal-scheduler
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan schedule:work
    volumes:
      - ./:/var/www
    networks:
      - technician-network
    depends_on:
      - app
      - db

  # Vite Development Server
  vite:
    image: technician-portal-app
    container_name: technician-portal-vite
    restart: unless-stopped
    working_dir: /var/www
    command: npm run dev
    ports:
      - "5173:5173"
    volumes:
      - ./:/var/www
    networks:
      - technician-network
    depends_on:
      - app

  # Nginx Web Server
  web:
    image: nginx:alpine
    container_name: technician-portal-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./nginx/conf.d/:/etc/nginx/conf.d/
    networks:
      - technician-network
    depends_on:
      - app

  # Database (MySQL)
  db:
    image: mysql:8.0
    container_name: technician-portal-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-tbh_portal_prod}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      SERVICE_TAGS: dev
      SERVICE_NAME: mysql
    volumes:
      - ./mysql-data:/var/lib/mysql
    ports:
      - "33061:3306"
    networks:
      - technician-network

networks:
  technician-network:
    driver: bridge
