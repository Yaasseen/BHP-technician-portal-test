version: '3.8'

services:
  # PHP Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: technician-portal-app
    container_name: technician-portal-app
    restart: always
    working_dir: /var/www
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    volumes:
      # Only persist storage, do NOT mount code (use image code)
      - ./storage:/var/www/storage
      # Share public assets with web container
      - static-content:/var/www/public
    networks:
      - technician-network
    depends_on:
      - db

  # Scheduler
  scheduler:
    image: technician-portal-app
    container_name: technician-portal-scheduler
    restart: always
    working_dir: /var/www
    command: php artisan schedule:work
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    volumes:
      - ./storage:/var/www/storage
    networks:
      - technician-network
    depends_on:
      - app
      - db

  # Nginx Web Server
  web:
    image: nginx:alpine
    container_name: technician-portal-nginx
    restart: always
    ports:
      - "8000:80"
    volumes:
      - ./nginx/conf.d/:/etc/nginx/conf.d/
      # Get public assets from the shared volume populated by 'app'
      - static-content:/var/www/public
    networks:
      - technician-network
    depends_on:
      - app

  # Database
  db:
    image: mysql:8.0
    container_name: technician-portal-db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-tbh_portal_prod}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./mysql-data:/var/lib/mysql
    networks:
      - technician-network

networks:
  technician-network:
    driver: bridge

volumes:
  static-content:
